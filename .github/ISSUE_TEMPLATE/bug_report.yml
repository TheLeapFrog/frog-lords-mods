name: Bug report
description: Something broken in a Frog Lord's addon
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which addon?
      options: [Diablo Orbs, Core, Character Sheet, Bags, Vendor, Talents, Quests, Loot, Skins, Profession Guide, Dungeon Guide, Wishlist, Arcade, Bucket o' Jokes]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Suite version
      placeholder: 1.0.0-beta
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Lua errors or /dorbs status output (if any)
      render: text
